name: Website

# Checks that the Astro site in website/ builds. The site itself is deployed
# by Vercel (project root directory: website).

on:
  push:
    branches: [main, V1.0.1A]
    paths:
      - "website/**"
      - ".github/workflows/website.yml"
  pull_request:
    paths:
      - "website/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test contact form
        run: npm test

      - name: Build site
        run: npm run build
