[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "Orion"
version = "1.0.3"
description = "Orion — modular AI assistant backend with composable intelligence primitives"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "Open Orion Contributors"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "click>=8",
    "datasets>=4.5.0",
    "ddgs>=9.11.4",
    "httpx>=0.27",
    "langsmith>=0.1.0",
    "openai>=1.30",
    "posthog>=3.0",
    "psutil>=5.9",
    "nvidia-ml-py",
    "psycopg2-binary>=2.9",
    "python-telegram-bot>=22.6",
    "rich>=13",
    "tomli>=2.0; python_version < '3.11'",
    "tomli-w>=1.0",
    "tomlkit>=0.12",
    "pycaw>=20251023",
    "qrcode>=8.2",
]

[project.optional-dependencies]
dev = [
    "maturin>=1.12.6",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "respx>=0.22",
    "ruff>=0.4",
    "pre-commit>=3.0",
]
inference-mlx = ["mlx-lm>=0.31.1; sys_platform == 'darwin'"]
inference-vllm = ["vllm>=0.16.0"]
inference-cloud = [
    "openai>=1.30",
    "anthropic>=0.30",
    "mistralai>=1.0",
]
inference-google = [
    "google-genai>=1.0",
]
inference-litellm = ["litellm>=1.40"]
inference-gemma = ["pygemma>=0.1.3"]
tools-search = [
    "tavily-python>=0.3",
    "ddgs>=9.11.4",
]
memory-faiss = [
    "faiss-cpu>=1.7",
    "sentence-transformers>=2.2",
    "numpy>=1.24",
]
memory-colbert = [
    "colbert-ai>=0.2",
    "torch>=2.0",
]
memory-pdf = ["pdfplumber>=0.10"]
memory-bm25 = ["rank-bm25>=0.2.2"]
server = [
    "fastapi>=0.110",
    "uvicorn>=0.30",
    "pydantic>=2.0",
    "python-multipart>=0.0.9",
    # Desktop tooling shipped with the app. The Tauri launcher syncs only the
    # server, inference-cloud and inference-google extras, so anything a
    # bundled tool imports has to be reachable from one of those -- otherwise
    # the tool registers fine, is offered to the model, and then fails on every
    # call. vision_capture did exactly that: all four of its imports were
    # missing from the runtime venv.
    "mss>=9.0",              # vision_capture: screen capture
    "pillow>=10.0",          # vision_capture: image encoding
    "ollama>=0.3",           # vision_capture: local moondream description
    "opencv-python>=4.9",    # vision_capture: webcam frames
]
openhands = ["openhands-sdk>=1.0; python_version >= '3.12'"]
gpu-metrics = ["nvidia-ml-py"]
energy-amd = ["amdsmi>=6.1"]
energy-apple = ["zeus-ml[apple]"]
energy-all = ["nvidia-ml-py", "amdsmi>=6.1", "zeus-ml[apple]"]
orchestrator-training = ["torch>=2.0", "transformers>=4.40"]
learning-dspy = ["dspy>=2.6"]
learning-gepa = ["gepa>=0.1"]
# ACE (Agentic Context Engineering) is supported via
# ``orion.learning.agents.ace_optimizer`` but ACE upstream isn't on
# PyPI and isn't structured as an installable Python package as of
# v1.0.1, so there's no ``learning-ace`` extra. To use ACE, follow the
# manual setup in docs/learning/ace.md (clone the upstream repo, add
# its ``src/`` to PYTHONPATH).
channel-telegram = ["python-telegram-bot>=21.0"]
channel-discord = ["discord.py>=2.3"]
channel-slack = ["slack-sdk>=3.27"]
channel-line = ["line-bot-sdk>=3.0"]
channel-viber = ["viberbot>=1.0"]
channel-messenger = ["pymessenger>=0.0.7"]
channel-reddit = ["praw>=7.0"]
channel-mastodon = ["Mastodon.py>=1.8"]
channel-xmpp = ["slixmpp>=1.8"]
channel-rocketchat = ["rocketchat-API>=1.30"]
channel-zulip = ["zulip>=0.9"]
channel-twitter = ["httpx>=0.27"]
channel-twitch = ["twitchio>=2.6"]
channel-nostr = ["pynostr>=0.6"]
channel-twilio = ["twilio>=9.0"]
channel-gmail = [
    "google-api-python-client>=2.0",
    "google-auth-oauthlib>=1.0",
    "google-auth-httplib2>=0.2",
]
browser = ["playwright>=1.40"]
media = ["openai>=1.30"]
mining-pearl-vllm = ["docker>=7.0", "httpx>=0.27"]
pdf = ["pdfplumber>=0.10"]
scheduler = ["croniter>=2.0"]
security-signing = ["cryptography>=43"]
sandbox-wasm = ["wasmtime>=25"]
sandbox-docker = ["docker>=7.0"]
dashboard = ["textual>=0.80"]
speech = ["faster-whisper>=1.0"]
speech-whispercpp = ["pywhispercpp>=1.2"]
speech-kokoro = ["kokoro", "soundfile", "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl"]
speech-deepgram = ["deepgram-sdk>=3.0"]
# Expressive local TTS with an emotion-intensity dial (MIT). Heavier than
# kokoro -- pulls torch -- so it is a separate extra, not part of `speech`.
speech-chatterbox = ["chatterbox-tts>=0.1.1", "soundfile", "torch", "torchaudio"]
voice-cli = ["sounddevice>=0.4.6", "numpy>=1.20"]
# Real-time voice pipeline orchestration (turn-taking, VAD, streaming STT/TTS).
# Groundwork only — no telephony transport wired yet. Phone calling needs a
# separate account with a provider (e.g. Twilio) before `pipecat-ai[twilio]`
# is worth adding here.
voice-pipecat = ["pipecat-ai>=0.0.50"]
eval-wandb = ["wandb>=0.17"]
eval-sheets = ["gspread>=6.0", "google-auth>=2.0"]
mining-pearl-cpu = [
    # Pearl Python packages (py-pearl-mining, miner-base, pearl-gateway) are
    # not on PyPI yet. They are installed at first `mine init` via the
    # build-from-pin path in src/orion/mining/_install.py:build_from_pin().
    # When Pearl publishes wheels, replace the line below with version pins.
    #
    # The extra remains as a feature-flag namespace so users can run
    # `uv sync --extra mining-pearl-cpu` to opt-in (it succeeds with no
    # additional resolution today; the actual install happens on demand).
]
framework-comparison = ["polars>=1.0"]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.25",
    "mkdocs-gen-files>=0.5",
    "mkdocs-literate-nav>=0.6",
]

[project.urls]
Homepage = "https://github.com/AstraDev-Labs/Orion-AI"
Documentation = "https://github.com/AstraDev-Labs/Orion-AI#readme"
Repository = "https://github.com/AstraDev-Labs/Orion-AI"
Issues = "https://github.com/AstraDev-Labs/Orion-AI/issues"

[project.scripts]
orion = "orion.cli:main"

[tool.uv]
# chatterbox-tts pins transformers==4.46.3, while vllm requires
# transformers>=4.56 -- the two can never share one resolution. Declaring
# them conflicting lets uv resolve each separately instead of failing the
# whole lock. They are both optional extras and are not useful on the same
# machine anyway (vllm targets server GPUs; chatterbox runs on CPU/small GPU).
conflicts = [
    [{ extra = "speech-chatterbox" }, { extra = "inference-vllm" }],
]

[tool.hatch.build.targets.wheel]
packages = ["src/orion"]

[tool.hatch.build.targets.wheel.force-include]
"src/orion/agents/claude_code_runner" = "_node_modules/claude_code_runner"
"src/orion/channels/whatsapp_baileys_bridge" = "_node_modules/whatsapp_baileys_bridge"
"scripts/install" = "_install_scripts"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "amd: requires AMD GPU",
    "apple: requires Apple Silicon",
    "cloud: requires cloud API keys",
    "docker: requires a working Docker daemon (no GPU required)",
    "live: requires running inference engine",
    "macos15: requires macOS 15+ (Sequoia) for Apple FM",
    "live_channel: requires real channel credentials (env vars)",
    "nvidia: requires NVIDIA GPU",
    "slow: long-running test",
    "live_external: requires HERMES_AGENT_PATH and OPENCLAW_PATH; spawns real foreign-framework subprocesses",
]

[tool.ruff]
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
"src/orion/evals/datasets/*.py" = ["E501"]
"src/orion/evals/scorers/*.py" = ["E501"]
# hybrid/ is research code with long prompt strings and paradigm-specific
# config dicts — same relaxation as evals research code above.
"src/orion/agents/hybrid/*.py" = ["E501"]
# research_loop.py carries the multi-paragraph planner system prompt as
# inline string literals; line-length wrapping would harm readability of
# the prompt itself.
"src/orion/agents/research_loop.py" = ["E501"]

[dependency-groups]
dev = [
    "maturin>=1.12.6",
]

[tool.hatch.metadata]
allow-direct-references = true
