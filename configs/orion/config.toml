# Orion configuration — GLM-4.7-Flash eval on 8x A100-80GB

# ═══════════════════════════════════════════════════════════════
# PILLAR 1: Intelligence — The Model
# ═══════════════════════════════════════════════════════════════
[intelligence]
default_model = "llama3.2:3b"             # Ollama model ID
fallback_model = "llama3.2:3b"            # Catalog alias fallback
preferred_engine = "ollama"               # Use local Ollama instance
provider = "local"                        # Running locally on this machine
quantization = "4bit"                     # 4-bit for 4GB VRAM
# Generation defaults for eval
temperature = 0.0                         # Deterministic for reproducibility
max_tokens = 2048                         # Standard eval output length
top_p = 0.9
top_k = 40
repetition_penalty = 1.0

# ═══════════════════════════════════════════════════════════════
# PILLAR 2: Agent — The Agentic Harness
# ═══════════════════════════════════════════════════════════════
[agent]
default_agent = "native_openhands"        # CodeAct-style agent
max_turns = 10                            # Up to 10 tool-calling turns
tools = "code_interpreter,web_search,file_read,calculator"
system_prompt = "Always greet the user very respectfully and elegantly. Keep responses concise and helpful. ALWAYS use the `web_search` tool for current events, news, or anything past your knowledge cutoff."
objective = "Answer questions accurately and respectfully"
context_from_memory = true                # Enable memory injection to learn user preferences and mindset over time

# ═══════════════════════════════════════════════════════════════
# PILLAR 3: Tools — MCP Interface
# ═══════════════════════════════════════════════════════════════
[memory]
default_backend = "sqlite"
db_path = "~/.orion/memory.db"
obsidian_dir = ""                          # Optional: path to an Obsidian vault to read notes from

[tools.mcp]
enabled = true

# ═══════════════════════════════════════════════════════════════
# PILLAR 4: Engine — The Inference Runtime
# ═══════════════════════════════════════════════════════════════
[engine]
default = "ollama"

[engine.vllm]
host = "http://localhost:8001"            # vLLM serving port

[engine.ollama]
host = "http://localhost:11434"

[engine.sglang]
host = "http://localhost:30000"

[engine.llamacpp]
host = "http://localhost:8080"

[engine.exo]
host = "http://localhost:52415"

[engine.nexa]
host = "http://localhost:18181"
# device = "npu"  # optional: cpu, gpu, npu

[engine.uzu]
host = "http://localhost:8080"

[engine.apple_fm]
host = "http://localhost:8079"

# ═══════════════════════════════════════════════════════════════
# PILLAR 5: Learning — Improvement Methodologies
# ═══════════════════════════════════════════════════════════════
[learning]
enabled = false                           # No learning during eval

[learning.routing]
policy = "heuristic"

[learning.intelligence]
policy = "none"

[learning.agent]
policy = "none"

[learning.metrics]
accuracy_weight = 0.6
latency_weight = 0.2
cost_weight = 0.1
efficiency_weight = 0.1

# ═══════════════════════════════════════════════════════════════
# Supporting config
# ═══════════════════════════════════════════════════════════════
[telemetry]
enabled = true
db_path = "~/.orion/telemetry.db"
gpu_metrics = true
gpu_poll_interval_ms = 50
energy_vendor = ""                       # Auto-detect; or force "nvidia"/"amd"/"apple"/"cpu_rapl"
warmup_samples = 0                       # Warmup iterations before steady-state measurement
steady_state_window = 5                  # Sliding window size for CV stability check
steady_state_threshold = 0.05            # Coefficient of variation threshold for steady state

[traces]
enabled = true                            # Record traces for analysis
db_path = "~/.orion/traces.db"

[server]
host = "127.0.0.1"
port = 8000
agent = "native_openhands"
